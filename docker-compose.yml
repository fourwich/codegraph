version: "3.8"
services:
  zero:
    image: dgraph/dgraph:v23.1.0
    volumes:
      - dgraph_zero:/dgraph
    ports:
      - "5080:5080"
      - "6080:6080"
    command: dgraph zero --my=zero:5080
  alpha:
    image: dgraph/dgraph:v23.1.0
    volumes:
      - dgraph_alpha:/dgraph
    ports:
      - "8080:8080"
      - "9080:9080"
    command: dgraph alpha --my=alpha:7080 --zero=zero:5080 --security "whitelist 0.0.0.0/0"
    depends_on:
      - zero
volumes:
  dgraph_zero:
  dgraph_alpha:
