[project]
name = "codegraph"
version = "0.1.0"
description = "Turn code structure, history, and design decisions into one queryable graph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodeGraph Contributors" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "tree-sitter>=0.22",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-python>=0.23",
    "pydgraph>=23.0.0",
    "python-dotenv>=1.0.0",
    "GitPython>=3.1.40",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=2.3.1",
    "httpx>=0.27.0",
]

[project.scripts]
codegraph = "codegraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
# Full `strict = true` still has known gaps in tree-sitter glue code;
# enable once those signatures are fully annotated.

[tool.coverage.run]
source = ["src/codegraph"]
omit = ["*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "dgraph: tests that require a live Dgraph cluster",
]
