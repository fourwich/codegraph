name: Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "main.js"
      - "demo.html"
      - "demo.cast"
      - "vendor/**"
      - "docs-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - name: Build the docs site
        working-directory: docs-site
        run: |
          npm ci
          npm run docs:build

      # The site is the single-page `index.html` plus the VitePress build, which
      # this workflow previously never produced: `path: .` uploaded the repository
      # and the docs site stayed offline. The built site is copied under
      # `/docs/` so both halves deploy together and neither overwrites the other.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css main.js _site/
          if [ -f demo.html ]; then cp demo.html _site/; fi
          if [ -d vendor ]; then cp -r vendor _site/; fi
          if [ -f demo.cast ]; then cp demo.cast _site/; fi
          cp -r docs-site/.vitepress/dist _site/docs
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
